[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coffee-report"
version = "0.0.1"
description = "CLI tool for building reports from students exam preparation CSV files"
requires-python = ">=3.11"
dependencies = [
    "tabulate>=0.9.0",
]

[tool.pytest.ini_options]
pythonpath = [
    "src"
]
testpaths = [
    "tests"
]